<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>无人机数据安全回传与分布式隐私计算平台</title>
    <style>
        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 520px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 36px 28px 36px;
        }
        h2 {
            text-align: center;
            color: #2d7ff9;
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin: 18px 0 6px 0;
            color: #333;
            font-weight: 500;
        }
        input[type="file"], input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            background: #2d7ff9;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 18px;
            transition: background 0.2s;
        }
        button:hover {
            background: #1a5fcc;
        }
        .result {
            margin-top: 28px;
            background: #f0f6ff;
            border-left: 4px solid #2d7ff9;
            padding: 16px;
            border-radius: 6px;
            color: #222;
        }
        .error {
            color: #d32f2f;
            margin-top: 18px;
            text-align: center;
        }
        .footer {
            text-align: center;
            color: #888;
            margin-top: 40px;
            font-size: 14px;
        }
        .curve {
            margin-top: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>无人机数据安全回传与分布式隐私计算平台</h2>
    <form id="uploadForm">
        <label>上传特征数据（npy/csv）</label>
        <input type="file" id="dataFile" accept=".npy,.csv" required>

        <label>节点数 K</label>
        <input type="number" id="k" value="3" min="1" max="10">

        <label>ρ (rho)</label>
        <input type="number" id="rho" value="1.0" step="0.01">

        <label>λ (lambda)</label>
        <input type="number" id="lam" value="0.05" step="0.01">

        <label>最大迭代次数</label>
        <input type="number" id="max_iter" value="100" min="1">

        <button type="submit">上传并计算</button>
    </form>
    <div class="result" id="result" style="display:none;"></div>
    <div class="error" id="error"></div>
    <div class="curve" id="curve"></div>
</div>
<div class="footer">
    &copy; 2026 无人机数据安全回传与分布式隐私计算平台
</div>
<script>
    const apiUrl = "http://localhost:8000/api/upload_and_process/"; // 修改为你的后端地址

    document.getElementById('uploadForm').onsubmit = async function(e) {
        e.preventDefault();
        document.getElementById('result').style.display = 'none';
        document.getElementById('error').innerText = '';
        document.getElementById('curve').innerHTML = '';

        const fileInput = document.getElementById('dataFile');
        if (!fileInput.files.length) {
            document.getElementById('error').innerText = '请上传数据文件';
            return;
        }
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('k', document.getElementById('k').value);
        formData.append('rho', document.getElementById('rho').value);
        formData.append('lam', document.getElementById('lam').value);
        formData.append('max_iter', document.getElementById('max_iter').value);

        try {
            const res = await fetch(apiUrl, {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerHTML =
                    `<b>最终MSE：</b> ${data.final_mse}<br><b>MSE收敛曲线：</b>`;
                // 简单绘制MSE曲线
                drawCurve(data.mse_curve);
            } else {
                document.getElementById('error').innerText = data.error || '计算失败';
            }
        } catch (err) {
            document.getElementById('error').innerText = '网络错误或服务器无响应';
        }
    };

    function drawCurve(curve) {
        if (!curve || !curve.length) return;
        const canvas = document.createElement('canvas');
        canvas.width = 420;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // 坐标轴
        ctx.strokeStyle = '#bbb';
        ctx.beginPath();
        ctx.moveTo(40, 10);
        ctx.lineTo(40, 160);
        ctx.lineTo(400, 160);
        ctx.stroke();
        // 曲线
        const maxY = Math.max(...curve);
        const minY = Math.min(...curve);
        ctx.strokeStyle = '#2d7ff9';
        ctx.beginPath();
        for (let i = 0; i < curve.length; i++) {
            const x = 40 + (360 * i / (curve.length - 1));
            const y = 160 - ((curve[i] - minY) / (maxY - minY + 1e-8)) * 140;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
        // 标注
        ctx.fillStyle = '#222';
        ctx.font = '12px Arial';
        ctx.fillText('迭代', 200, 175);
        ctx.save();
        ctx.translate(10, 100);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('MSE', 0, 0);
        ctx.restore();
        document.getElementById('curve').appendChild(canvas);
    }
</script>
</body>
</html>
